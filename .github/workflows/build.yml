name: Windows build and offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source hygiene
        shell: powershell
        run: ./scripts/check-source.ps1
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Offline self-tests
        shell: powershell
        run: ./scripts/test.ps1 -NoBuild
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-${{ github.run_id }}
          path: |
            artifacts/bin/SpokenFlow.exe
            artifacts/bin/SpokenFlow.exe.config
            artifacts/self-test.txt
          if-no-files-found: warn
          retention-days: 14
